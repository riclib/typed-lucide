[workspace]
members = ["generate"]

[package]
name = "typed-lucide"
version = "1.40.0"
edition = "2024"
license = "MIT AND ISC"
description = "Every Lucide icon as a Rust enum variant, with its inline SVG, tags, categories, a scored search and an icon-search CLI."
repository = "https://github.com/riclib/typed-lucide"
readme = "README.md"
keywords = ["lucide", "icons", "svg", "askama", "typed"]
categories = ["web-programming", "gui"]

[features]
cli = ["dep:clap"]
serde = ["dep:serde"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
roxmltree = "0.20"
serde_json = "1"

[[bin]]
name = "icon-search"
path = "src/bin/icon-search.rs"
required-features = ["cli"]
